# Render Blueprint Deployment Configuration for Sovereign Soundbox Backend
# Note: SQLite requires a persistent disk mount so invoices and encrypted wallet config persist across deploys and restarts.
services:
  - type: web
    name: sovereign-soundbox-api
    runtime: node
    plan: starter # Starter plan or higher is required for persistent disk mounts on Render
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        sync: false # Set to your deployed Vercel frontend URL, e.g. https://sovereign-soundbox.vercel.app
      - key: SERVER_ENCRYPTION_KEY
        generateValue: true # Generates a persistent 32-byte hex key for AES-256-GCM encryption
      - key: SQLITE_DB_PATH
        value: /var/data/soundbox.db
    disk:
      name: soundbox-data
      mountPath: /var/data
      sizeGB: 1

